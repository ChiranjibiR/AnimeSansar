name: Daily Fashion Competitor Tracker (Daily + Weekly Reports)

on:
  schedule:
    # 08:00 India Standard Time (02:30 UTC)
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-fashion-tracker
  cancel-in-progress: false

jobs:
  track-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      # Validate the five configured daily brands. Do not rewrite config.json in CI.
      - name: Validate tracker configuration
        run: |
          python - <<'PYCONFIG'
          import json
          from pathlib import Path

          path = Path("config.json")
          config = json.loads(path.read_text(encoding="utf-8"))
          expected = {"bearhouse", "bonkerscorner", "snitch", "the souled store", "urban monkey"}
          actual = {brand.get("name", "").strip().lower() for brand in config.get("brands", [])}
          if actual != expected:
              raise SystemExit(f"Unexpected configured brand set: {sorted(actual)}")
          if config.get("settings", {}).get("max_products_per_brand_per_run") != 0:
              raise SystemExit("Expected max_products_per_brand_per_run=0 (no product cap)")
          print("Validated brands:", ", ".join(brand["name"] for brand in config["brands"]))
          PYCONFIG

      - name: Scrape and rebuild CSV history
        run: python tracker.py run

      - name: Verify weekly report outputs
        run: |
          python - <<'PYREPORT'
          from pathlib import Path
          expected = [
              "weekly_launch_summary.csv",
              "weekly_price_summary.csv",
              "weekly_fit_summary.csv",
              "weekly_size_availability.csv",
          ]
          missing = [name for name in expected if not (Path("reports") / name).is_file()]
          if missing:
              raise SystemExit(f"Weekly reports were not generated: {missing}")
          print("Weekly reports generated:", ", ".join(expected))
          PYREPORT

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit CSV data and reports
        run: |
          git add data/ reports/
          if git diff --cached --quiet; then
            echo "No CSV changes to commit."
          else
            git commit -m "Update daily and weekly fashion tracker data $(date -u +'%Y-%m-%d')"
            git push
          fi
