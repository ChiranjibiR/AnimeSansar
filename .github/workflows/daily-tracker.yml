
name: Daily Fashion Competitor Tracker

on:
  schedule:
    # 08:00 India Standard Time (02:30 UTC)
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-fashion-tracker
  cancel-in-progress: false

jobs:
  track-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      # Exclude H&M and validate the five daily brands.
      # This modifies config.json only inside the workflow runner.
      - name: Validate daily tracker brands
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("config.json")
          config = json.loads(path.read_text(encoding="utf-8"))

          config["brands"] = [
              brand
              for brand in config.get("brands", [])
              if brand.get("name", "").strip().lower() != "h&m"
          ]

          expected = {
              "bearhouse",
              "bonkerscorner",
              "snitch",
              "the souled store",
              "urban monkey",
          }

          actual = {
              brand.get("name", "").strip().lower()
              for brand in config["brands"]
          }

          if actual != expected:
              raise SystemExit(
                  "Unexpected daily brand set: "
                  f"{sorted(actual)}"
              )

          path.write_text(
              json.dumps(config, indent=2) + "\n",
              encoding="utf-8",
          )

          print("Validated daily brands:")
          for brand in config["brands"]:
              print(f"- {brand['name']}")
          PY

      - name: Scrape and rebuild CSV history
        run: python tracker.py run

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit CSV data and reports
        run: |
          git add data/ reports/

          if git diff --cached --quiet; then
            echo "No CSV changes to commit."
          else
            git commit -m "Update fashion tracker data $(date -u +'%Y-%m-%d')"
            git push origin HEAD:${{ github.ref_name }}
          fi
