name: Daily Fashion Competitor Tracker

on:
  schedule:
    # 08:00 India Standard Time (02:30 UTC)
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-fashion-tracker
  cancel-in-progress: false

jobs:
  track-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Scrape and rebuild CSV history
        run: python tracker.py run

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit CSV data and reports
        run: |
          git add data/ reports/
          if git diff --cached --quiet; then
            echo "No CSV changes to commit."
          else
            git commit -m "Update fashion tracker data $(date -u +'%Y-%m-%d')"
            git push
          fi
