name: H&M First Page Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-hm:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Diagnose H&M first new-arrivals page
        run: python tracker.py diagnose-hm
